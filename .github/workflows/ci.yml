name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@cfd51f3d5423cb16155b94e020cdd7eaeebd0833
        with:
          install-mold: 'true'
          expect-cache: any
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@cfd51f3d5423cb16155b94e020cdd7eaeebd0833
        with:
          version: "0.6.1"

      - name: Format
        run: make check-fmt
      - name: Spelling
        run: make spelling
      - name: Workflow contracts
        run: make workflow-contracts
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34
        with:
          globs: '**/*.md'
      - name: Install the Whitaker Dylint suite
        uses: leynos/shared-actions/.github/actions/install-whitaker@cfd51f3d5423cb16155b94e020cdd7eaeebd0833
      - name: Lint
        run: make lint
      # Coverage here serves the local ratchet and nothing else: the report is
      # not archived and CodeScene is never called. coverage-main.yml writes
      # the baseline this compares against and owns the CodeScene upload, so
      # the selection below must match that workflow's field for field.
      - name: Test and Measure Coverage
        env:
          # One of the two exclusions from the build standard: a coverage build is a
          # measurement, so it takes neither the parallel frontend nor the mold linker.
          # Assigning RUSTFLAGS displaces every `rustflags` table in .cargo/config.toml.
          RUSTFLAGS: -D warnings
        uses: leynos/shared-actions/.github/actions/generate-coverage@cfd51f3d5423cb16155b94e020cdd7eaeebd0833
        with:
          output-path: lcov.info
          format: lcov
          use-cargo-nextest: 'false'
          with-ratchet: 'true'
          publish-artefact: 'false'
