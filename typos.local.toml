# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
# Official names and API spelling: Azure Architecture Center, GitHub Flavored
# Markdown, and tokio::test's `flavor` argument.
accepted = ["Center", "Flavored", "flavor"]

[words.corrections]

[patterns]
ignore = [
  # "mold" names the linker (https://github.com/rui314/mold) in these
  # contexts only; the mould correction stays active elsewhere.
  "-fuse-ld=mold",
  "mold linker",
  "Cranelift \\+ mold",
  "Cranelift and mold",
  "`mold`",
]

[files]
exclude = []
